[project]
name = "forge-agent"
version = "0.1.0"
description = "Forge: a Claude-Code-style AI coding agent harness built from scratch on Gemini (Vertex AI)"
requires-python = ">=3.10"
dependencies = ["google-genai>=1.0", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
